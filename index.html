<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Willkommen</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="split">
        <div class="left">
          <img
            id="picture"
            width="800px"
            height="800px"
            src="Images/juliush-fantasy-1932.gif"
            alt="Museum"
          />
          <h4>Obiges Gondelwerk von Julius H.</h4>
        </div>
        <div class="right">
          <h1>Willkommen im historischen Museum</h1>
          <h3>Klicken Sie einfach auf den Kaiser, um einzutreten</h3>
          <img id="door" src="Images/door.gif" alt="Door" />
        </div>
      </div>
    </div>
    <div class="kaiser">
      <img
        id="kaiser"
        width=" 200px"
        height="300px"
        src="Images/kaiser.png"
        alt="Kaiser"
      />
    </div>
    <script src="main.js"></script>
  </body>
</html>
